name: Deploy SG Rebate Tool to GitHub Pages

on:
  push:
    branches:
      - master
      - claude/seoul-sg-rebate-tool-hc77fc
    paths:
      - 'seoul-sg-rebate/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # creates the Pages site on first run so no manual settings step is needed
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: seoul-sg-rebate
      - id: deployment
        uses: actions/deploy-pages@v4
